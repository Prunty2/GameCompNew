name: Desktop compatibility

on:
  pull_request:
  workflow_dispatch:
    inputs:
      installer_run_id:
        description: Optional prior run containing the unchanged Windows installer to retest
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run test:desktop-web -- --project=chromium
      - run: npm run desktop:windows -- --ci
        if: inputs.installer_run_id == ''
      - name: Retrieve a previously built installer for native test iteration
        if: inputs.installer_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: FSHING-Windows-x64
          run-id: ${{ inputs.installer_run_id }}
          github-token: ${{ github.token }}
          path: previous-desktop-build
      - name: Install the packaged app
        shell: pwsh
        run: |
          $installer = Get-ChildItem . -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'FSHING test install'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $binary = Join-Path $destination 'FSHING.exe'
          if (!(Test-Path $binary)) { throw "Installed app missing: $binary" }
          "FSHING_APP=$binary" >> $env:GITHUB_ENV
      - name: Set up native WebView2 testing
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          if ($LASTEXITCODE -ne 0) { throw 'tauri-driver install failed' }
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" | Sort-Object { [version]$_.VersionInfo.FileVersion } -Descending | Select-Object -First 1
          if (!$runtime) { throw 'WebView2 runtime was not installed' }
          $version = $runtime.VersionInfo.FileVersion
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP/edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP/edgedriver.zip" "$env:RUNNER_TEMP/edgedriver"
          "EDGE_DRIVER=$env:RUNNER_TEMP/edgedriver/msedgedriver.exe" >> $env:GITHUB_ENV
      - name: Test native app as a standard user
        shell: pwsh
        run: |
          # WebView2 150+ deliberately ignores automation flags in elevated hosts.
          # Use the same user's limited token, without changing WebView2 policies.
          $taskName = 'FSHING native smoke'
          $node = (Get-Command node).Source
          $script = Join-Path $PWD 'scripts/windows-native-smoke.mjs'
          $action = New-ScheduledTaskAction -Execute $node -Argument "`"$script`" `"$env:FSHING_APP`" `"$env:EDGE_DRIVER`"" -WorkingDirectory $PWD
          $principal = New-ScheduledTaskPrincipal -UserId ([System.Security.Principal.WindowsIdentity]::GetCurrent().Name) -LogonType Interactive -RunLevel Limited
          Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Force | Out-Null
          try {
            Start-ScheduledTask -TaskName $taskName
            $deadline = (Get-Date).AddMinutes(5)
            do {
              Start-Sleep -Seconds 2
              $info = Get-ScheduledTaskInfo -TaskName $taskName
              $state = (Get-ScheduledTask -TaskName $taskName).State
            } while (($state -eq 'Running' -or $info.LastRunTime.Year -lt 2020) -and (Get-Date) -lt $deadline)
            if (Test-Path native-test-results/result.json) { Get-Content native-test-results/result.json }
            if ($state -eq 'Running' -or $info.LastTaskResult -ne 0) { throw "Native test failed or timed out: $($info.LastTaskResult)" }
            if (!(Test-Path native-test-results/result.json)) { throw 'Native test produced no result' }
          } finally {
            Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false
          }
      - run: npm run test:e2e
      - name: Keep Windows installer and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FSHING-Windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            previous-desktop-build/**/bundle/nsis/*-setup.exe
            test-results/
            native-test-results/
          if-no-files-found: warn
